daemon off;
worker_processes 1;
pid nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path client-body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;

    # Normalize the Bearer header so alternate spacing cannot evade per-key limits.
    # CLIProxyAPI remains responsible for validating the key; no secrets live here.
    map $http_authorization $api_key {
        default "";
        "~*^Bearer +(?<bearer_token>[A-Za-z0-9._~+/-]+=*) *$" $bearer_token;
    }

    map "$request_method:$uri" $api_route_allowed {
        default 0;
        "GET:/v1/models" 1;
        "POST:/v1/chat/completions" 1;
        "POST:/v1/responses" 1;
    }

    limit_req_zone $api_key zone=per_key_rate:1m rate=60r/m;
    limit_req_zone $server_name zone=total_rate:1m rate=120r/m;
    limit_conn_zone $api_key zone=per_key_connections:1m;
    limit_conn_zone $server_name zone=total_connections:1m;

    server {
        listen 127.0.0.1:8318;
        server_name cliproxyapi-public;

        # All other paths, including management, OAuth callbacks and static files,
        # are rejected before proxying, even when a valid management key is supplied.
        if ($api_route_allowed = 0) { return 404; }
        if ($api_key = "") { return 401; }

        client_max_body_size 10m;
        client_header_timeout 15s;
        client_body_timeout 30s;
        send_timeout 60s;
        keepalive_timeout 15s;

        limit_req zone=per_key_rate burst=10 nodelay;
        limit_req zone=total_rate burst=20 nodelay;
        limit_req_status 429;
        limit_conn per_key_connections 4;
        limit_conn total_connections 16;
        limit_conn_status 429;

        location / {
            # These endpoints use JSON bodies, not query parameters. Drop the query
            # string and alternative auth headers so they cannot bypass per-key limits.
            # Forward only the normalized, allowlisted URI.
            proxy_pass http://127.0.0.1:8317$uri;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:8317;
            proxy_set_header Authorization "Bearer $api_key";
            proxy_set_header X-Api-Key "";
            proxy_set_header X-Goog-Api-Key "";
            proxy_set_header Upgrade "";
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";

            # Keep SSE streaming; never cache API responses.
            proxy_buffering off;
            proxy_cache off;
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
